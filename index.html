<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0814">
<title>Bonnie Bounce</title>
<meta name="description" content="Bonnie Bounce — a twenty-level platform adventure starring Bonnie.">
<!-- added to a home screen it opens full screen, like an app, with Bonnie as its icon -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bonnie Bounce">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  /* The game fills the window, with the touch buttons drawn over it on a
     phone or tablet (js/touch.js). Held upright it still plays, and a
     small note under the picture suggests turning sideways — a little
     phone, gently turning. The safe-area padding keeps it out of the notch. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0c0814; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas {
    display: block; flex: none;
    /* whole pixels, scaled with no smoothing: the screen is the art */
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  canvas#screen { background: #000; }
  html.portrait, html.portrait body { background: #1c1430; }
  #turn { display: none; }
  html.portrait #turn {
    display: flex; align-items: center; gap: 10px; margin-top: 22px; padding: 9px 16px 9px 12px;
    border-radius: 99px; background: rgba(255, 244, 220, 0.08); box-shadow: inset 0 0 0 1px rgba(255, 244, 220, 0.14);
    font: 700 14px/1.2 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; color: #fff4dc; letter-spacing: 0.01em;
    pointer-events: none;
  }
  #turn svg { width: 26px; height: 26px; flex: none; overflow: visible; }
  #turn .phone { transform-origin: 13px 13px; animation: turn 3.2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 50%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  @media (prefers-reduced-motion: reduce) { #turn .phone { animation: none; transform: rotate(-90deg); } }
</style>
</head>
<body>
  <canvas id="screen" width="240" height="144" aria-label="Bonnie Bounce game screen" role="img"></canvas>
  <p id="turn"><svg viewBox="0 0 26 26" aria-hidden="true"><g class="phone"><rect x="7.5" y="2.5" width="11" height="21" rx="2.5" fill="#3a2450" stroke="#fff4dc" stroke-width="1.6"/><rect x="9.5" y="5" width="7" height="13" rx="1" fill="#8ccfff"/><rect x="9.5" y="14.5" width="7" height="3.5" fill="#5cb84a"/><circle cx="13" cy="20.5" r="0.9" fill="#fff4dc"/></g></svg>Turn sideways for the best view</p>

  <script src="js/core.js"></script>
  <script src="js/art.js"></script>
  <script src="js/creatures.js"></script>
  <script src="js/backdrop.js"></script>
  <script src="js/light.js"></script>
  <script src="js/map.js"></script>
  <script src="js/music.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/game.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/fresh.js"></script>
</body>
</html>
